apiVersion: connectors.lumnik.io/v1
kind: Connector
metadata:
  name: wow-atelier-rest
  connector_type: jdbc-generic
  tenant: 1
  tags: [atelier]
spec:
  connection:
    url: jdbc:postgresql://localhost:5432/piscine
    user: adempiere
    password_env: WOW_SRC_PASSWORD
  defaults:
    schema: adempiere
  source:
    tables:
      - name: c_invoice
        mode: full
        pk_columns: [c_invoice_id]
      - name: c_bpartner
        mode: full
        pk_columns: [c_bpartner_id]
      - name: c_payment
        mode: full
        pk_columns: [c_payment_id]
  target:
    table_prefix: t_
    tags: [atelier]
