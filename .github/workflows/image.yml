# lumnik open edition — the public hub image. Each release tag vX.Y.Z builds the hub from this
# tree (the open edition, Apache-2.0) and pushes ghcr.io/icreated/lumnik:{X.Y.Z,latest,main}; with
# the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets set, docker.io/icreated/lumnik gets the same
# tags. A clone's docker-compose.selfhost.yml names this image, so `up.sh` pulls it instead of
# compiling. Seeded by the publication ritual, like ci.yml. The Pro image (lumnik-hub) is built in
# the monorepo and never published from here.
name: image

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  # #1998: sign the image's provenance with the workflow's identity (Sigstore), and store the attestation.
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build-push:
    # A release tag of this repository only: a fork, or a dispatch from a branch, pushes nothing.
    if: github.repository == 'icreated/lumnik-open' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: registries
        name: Registries — GHCR always, Docker Hub when its secrets are set
        run: |
          images="ghcr.io/${{ github.repository_owner }}/lumnik"
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            images="$images,docker.io/icreated/lumnik"
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Docker Hub skipped: set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in this repository's secrets"
          fi
          echo "images=$images" >> "$GITHUB_OUTPUT"

      - if: steps.registries.outputs.dockerhub == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.registries.outputs.images }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
            type=raw,value=main
          labels: |
            org.opencontainers.image.title=lumnik
            org.opencontainers.image.description=lumnik Open edition hub (Apache-2.0). Self-host: ./deploy/selfhost/up.sh

      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # #1998: how the image was built (provenance) and what it holds (SBOM), stored in the registry
          # beside it: `docker buildx imagetools inspect <image> --format '{{ json .Provenance }}'`.
          provenance: mode=max
          sbom: true

      # The attestations above are unsigned. This one is signed by this workflow's identity, so anyone can prove the
      # image was built here, from this repository, at this tag:
      #   gh attestation verify oci://ghcr.io/icreated/lumnik:<version> -R icreated/lumnik-open
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/lumnik
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
