quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=lumnik
quarkus.datasource.password=lumnik

quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.database.default-schema=identity
quarkus.hibernate-orm.log.sql=true

quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=identity
quarkus.flyway.locations=classpath:db/migration/identity
quarkus.flyway.validate-on-migrate=false

quarkus.index-dependency.common.group-id=io.lumnik
quarkus.index-dependency.common.artifact-id=lumnik-common
