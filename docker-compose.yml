services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    container_name: lumnik-db
    environment:
      POSTGRES_DB: lumnik
      POSTGRES_USER: lumnik
      POSTGRES_PASSWORD: lumnik
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumnik -d lumnik"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: lumnik-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8180
    ports:
      - "8180:8180"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import
    depends_on:
      postgres:
        condition: service_healthy

  ollama:
    image: ollama/ollama
    container_name: lumnik-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  minio:
    # #708: quay.io/minio/minio (every tag, including this one) has required an authenticated
    # account since 2026-09-24 — re-hosted at ghcr.io/icreated/minio (see MinioTestImage's javadoc
    # for the bump procedure). Pinned by tag here, not by digest like the Java ITs: this is the dev
    # convenience stack, not the gate.
    image: ghcr.io/icreated/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: lumnik-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    # #708/#725: same quay.io lockout as the minio service above — quay.io/minio/mc is gated too.
    # ghcr.io/icreated/minio (see MinioTestImage's javadoc) bundles its own mc, built from source
    # alongside minio itself, so it doubles as the mc image here instead of a separate mirror.
    image: ghcr.io/icreated/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: lumnik-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin123};
        mc mb --ignore-existing local/lumnik-attachments;
        exit 0;
      "

  sftp:
    image: atmoz/sftp:alpine
    container_name: lumnik-sftp
    command: csvuser:csvpass:::upload
    ports:
      - "2222:22"
    volumes:
      - ./scripts/proof/csv/sftp-seed:/home/csvuser/upload/seed:ro

  wiremock:
    image: wiremock/wiremock:3.9.1
    container_name: lumnik-wiremock
    ports:
      - "8081:8080"
    volumes:
      - ./scripts/proof/rest/wiremock:/home/wiremock:ro
    command: ["--global-response-templating"]

volumes:
  pg_data:
  minio_data:
  ollama_data: {}
