site_name: lumnik
site_description: Defrost the enterprise — deploy the hub, connect a legacy source, ask your data.
site_url: https://docs.lumnik.io/
docs_dir: docs

validation:
  links:
    anchors: warn

theme:
  name: material
  # overrides/main.html adds the Umami analytics tag (cookieless — no consent
  # banner needed; pinned to docs.lumnik.io so local serves never count).
  custom_dir: overrides
  # The lumnik.fr type trio: Fraunces (headings, loaded by the stylesheet),
  # Archivo (text), IBM Plex Mono (code and technical labels).
  font:
    text: Archivo
    code: IBM Plex Mono
  palette:
    # The night comes first — lumnik.fr is a dark site.
    # `custom` hands every colour to stylesheets/lumnik.css.
    - scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Switch to light }
    - scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Switch to dark }
  features:
    - navigation.sections
    - navigation.tracking
    - navigation.top
    - toc.follow
    - search.suggest
    - content.code.copy

extra_css:
  - stylesheets/lumnik.css

markdown_extensions:
  - admonition
  # md_in_html: an HTML element carrying a `markdown` attribute gets its content
  # processed as Markdown — links written as [text](page.md) inside the lm-*
  # components are then resolved AND validated by --strict. Raw <a href> never is:
  # always prefer a markdown link inside a `markdown`-attributed element.
  - md_in_html
  # attr_list lets a markdown link carry a class — [See the WOW](wow.md){ .lm-button }
  # — so even styled buttons stay validated links, never raw <a href>.
  - attr_list
  - pymdownx.details
  # No permalink pilcrow (¶) on headings — the anchor ids themselves are
  # generated by toc regardless, so deep links keep working.
  - toc
  - pymdownx.highlight
  # The mermaid custom fence hands ```mermaid blocks to Material's built-in
  # mermaid.js integration (theme-aware) instead of highlighting them as code.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true

# Internal working docs never ship on the installateur site.
exclude_docs: |
  superpowers/
  snapshot/
  studies/
  # Anchored: this is docs/demo/, the internal WOW harness — NOT docs/connectors/rest/demo/,
  # the bench the REST page tells the reader to run, which has to ship with the site.
  /demo/
  !/demo/wow-customer/README.md
  dev-setup.md
  connectors/csv/README.md
  connectors/rest/README.md

