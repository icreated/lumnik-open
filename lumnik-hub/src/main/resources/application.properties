quarkus.application.name=lumnik-hub
quarkus.http.port=8080
quarkus.http.test-port=0

# ── Datasources ────────────────────────────────────────────────────────────
# <default> = runtime queries, runs as lumnik_app (RLS-enforced).
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${LUMNIK_APP_DB_USERNAME:lumnik_app}
quarkus.datasource.password=${LUMNIK_APP_DB_PASSWORD:lumnik_app_dev_password}
%dev.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5433/lumnik}
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5433/lumnik}
# Test: share one DevServices postgres between both datasources so Flyway (admin)
# and app queries (default) hit the same DB.
quarkus.datasource.devservices.service-name=lumnik-shared
quarkus.datasource.devservices.db-name=lumnik

# 'admin' = Flyway migrations + importer + system-mode cross-tenant ops.
# Runs as lumnik_admin (BYPASSRLS).
quarkus.datasource."admin".db-kind=postgresql
quarkus.datasource."admin".username=${LUMNIK_ADMIN_DB_USERNAME:lumnik_admin}
quarkus.datasource."admin".password=${LUMNIK_ADMIN_DB_PASSWORD:lumnik_admin_dev_password}
%dev.quarkus.datasource."admin".jdbc.url=${DB_URL:jdbc:postgresql://localhost:5433/lumnik}
%prod.quarkus.datasource."admin".jdbc.url=${DB_URL:jdbc:postgresql://localhost:5433/lumnik}
quarkus.datasource."admin".devservices.service-name=lumnik-shared
quarkus.datasource."admin".devservices.db-name=lumnik
# Test: admin datasource reuses the default DevServices DB by pointing to the
# same dynamically-assigned JDBC URL. Setting an explicit URL disables DevServices
# for admin (avoiding a second container). Both connect as lumnik_app = DevServices user.
%test.quarkus.datasource."admin".jdbc.url=${quarkus.datasource.jdbc.url}
%test.quarkus.datasource."admin".username=${LUMNIK_APP_DB_USERNAME:lumnik_app}
%test.quarkus.datasource."admin".password=${LUMNIK_APP_DB_PASSWORD:lumnik_app_dev_password}
# Test only: expose Agroal pool metrics on the admin datasource so connection-leak tests
# can assert activeCount()/availableCount() deterministically instead of polling
# pg_stat_activity. Not set for dev/prod — no reason to pay metrics overhead there.
%test.quarkus.datasource."admin".jdbc.enable-metrics=true
# Disable JTA enlistment for the admin datasource (ALL profiles): it is a BYPASSRLS
# utility DS (DDL, cross-tenant ops, DynamicTableWriter/Registry, advisory lock) that uses
# raw JDBC / auto-commit and must NOT be enrolled in the JTA TX managed by the default
# EntityManager. Otherwise Narayana rejects enlisting a second local resource when both the
# JPA EM (default DS) and the admin DS are used in the same JTA transaction — which is exactly
# what happens when a connector run (default-DS @Transactional chunk) writes to the hub via
# DynamicTableWriter (admin DS). Was %test-only; that gap broke real dev/prod ingest writes.
quarkus.datasource."admin".jdbc.transactions=disabled

# ── 'readonly' datasource — SqlGuard layer 1 (physical firewall, spec section 4) ──
# Runs as lumnik_readonly (GRANT SELECT only + default_transaction_read_only=on).
# The Ask-to-SQL engine runs LLM-generated SQL ONLY through this datasource.
quarkus.datasource."readonly".db-kind=postgresql
quarkus.datasource."readonly".username=${LUMNIK_READONLY_DB_USERNAME:lumnik_readonly}
quarkus.datasource."readonly".password=${LUMNIK_READONLY_DB_PASSWORD:lumnik_readonly_dev_password}
%dev.quarkus.datasource."readonly".jdbc.url=${DB_URL:jdbc:postgresql://localhost:5433/lumnik}
%prod.quarkus.datasource."readonly".jdbc.url=${DB_URL:jdbc:postgresql://localhost:5433/lumnik}
quarkus.datasource."readonly".devservices.service-name=lumnik-shared
quarkus.datasource."readonly".devservices.db-name=lumnik
# Test: reuse the DevServices DB as the app user (the read-only ROLE is created by V15;
# guard behavior is unit-tested by SqlGuard, role-level enforcement is Plan 3 on the real DB).
%test.quarkus.datasource."readonly".jdbc.url=${quarkus.datasource.jdbc.url}
%test.quarkus.datasource."readonly".username=${LUMNIK_APP_DB_USERNAME:lumnik_app}
%test.quarkus.datasource."readonly".password=${LUMNIK_APP_DB_PASSWORD:lumnik_app_dev_password}
# %test ONLY, and deliberately so — do NOT promote this to all profiles.
#
# Enlistment is LOAD-BEARING for RLS on this datasource. TenantRlsScope pins the tenant with
# SET LOCAL app.current_tenant + SET LOCAL search_path = '', and SET LOCAL is transaction-scoped:
# on a non-enlisted (autoCommit) connection each statement commits into its own empty transaction
# and is discarded before the query runs. Disabling enlistment here therefore does not merely
# change pooling — it silently unbinds the tenant on all four raw-JDBC readers (view render,
# view detail, ask-to-SQL, workflow data-truth) and drops the empty search_path that LeakGuard
# relies on to close unqualified table names.
#
# This was promoted to all profiles on 2026-08-11 as "defence in depth" and reverted the next day:
# the test profile makes the breakage invisible by construction, so no test caught it.
# TenantRlsScope now fails fast on a missing transaction, which is the real guard.
%test.quarkus.datasource."readonly".jdbc.transactions=DISABLED

# ── Hibernate ORM (default PU — no default-schema; entities declare their own) ──
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
%dev.quarkus.hibernate-orm.log.sql=false
# Disable post-boot schema validation in dev: Flyway runs during StartupEvent (after Hibernate
# init), creating a race with the validation thread. Prod validation is handled by Flyway itself.
%dev.quarkus.hibernate-orm.validate-in-dev-mode=false

# ── Flyway: disabled at startup — PlatformFlywayRunner handles it ───────────
quarkus.flyway.migrate-at-start=false

# ── Jandex: make Quarkus scan module JARs for CDI beans + JPA entities ─────
quarkus.index-dependency.common.group-id=io.lumnik
quarkus.index-dependency.common.artifact-id=lumnik-common
quarkus.index-dependency.identity.group-id=io.lumnik
quarkus.index-dependency.identity.artifact-id=lumnik-identity
quarkus.index-dependency.rag.group-id=io.lumnik
quarkus.index-dependency.rag.artifact-id=lumnik-rag

# ── OpenAPI ────────────────────────────────────────────────────────────────
quarkus.smallrye-openapi.info-title=Lumnik Platform API
quarkus.smallrye-openapi.info-version=0.1.0
# Ship Swagger UI in the packaged app too (Quarkus default is dev/test only):
# the self-host stack is loopback-bound, the spec at /q/openapi is public anyway,
# and a try-it console is exactly what an API tester expects to find.
quarkus.swagger-ui.always-include=true

# ── Observability ──────────────────────────────────────────────────────────
# %X{runId} is empty off a run thread (one blank slot, as %X{tenantId} already is off a
# request) and carries the run's id on every line a run writes — including the reader and
# writer WARNs, which used to name neither the run nor the tenant.
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %X{tenantId} %X{runId} %s%e%n
# The logging-json extension defaults json=true in EVERY profile — keep the
# human one-line format for eyes (dev, test) and JSON for collectors (prod).
quarkus.log.console.json=false
%prod.quarkus.log.console.json=true
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_EXPORTER_ENDPOINT:http://localhost:4317}
%dev.quarkus.otel.sdk.disabled=true
# No OTLP collector runs during the test suite — without this every @QuarkusTest floods the
# log with "Connection refused: localhost:4317" + 3× retry stacks. Mirrors %dev (and the
# QUARKUS_OTEL_SDK_DISABLED the otk-gold workflow sets on the booted hub).
%test.quarkus.otel.sdk.disabled=true

# ── Security ──────────────────────────────────────────────────────────────
# Dev mode: bypass JWT auth, read tenant/user from request headers instead.
# Staging/prod: set to false — TenantContextFilter reads JWT claims.
%dev.lumnik.security.dev-bypass=true
%test.lumnik.security.dev-bypass=true
lumnik.security.dev-bypass=false

# Inbound rate limits (requests/minute per tenant, fixed 60s window, in-memory single-node).
# 0 disables. Per-bucket override: lumnik.ratelimit.<name>.rpm
lumnik.ratelimit.default.rpm=60
lumnik.ratelimit.view-generate.rpm=10
%dev.lumnik.ratelimit.default.rpm=0
%dev.lumnik.ratelimit.view-generate.rpm=0

# OIDC: disabled in dev (no Keycloak required to run locally).
# Activate %staging or %prod profile to enable real token validation.
%dev.quarkus.oidc.tenant-enabled=false
%test.quarkus.oidc.tenant-enabled=false
%staging.quarkus.oidc.auth-server-url=http://localhost:8180/realms/lumnik
%staging.quarkus.oidc.client-id=lumnik-backend
%staging.quarkus.oidc.application-type=service
%staging.quarkus.oidc.token.audience=lumnik-backend
%staging.quarkus.oidc.roles.source=accesstoken
%staging.quarkus.oidc.roles.role-claim-path=groups
%prod.quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL}
%prod.quarkus.oidc.client-id=lumnik-backend
%prod.quarkus.oidc.application-type=service
%prod.quarkus.oidc.token.audience=lumnik-backend
%prod.quarkus.oidc.roles.source=accesstoken
%prod.quarkus.oidc.roles.role-claim-path=groups

# Opt-in: ask the IdP's UserInfo endpoint on every request, so an account disabled in the IdP is
# refused on its very next request instead of on token expiry. The hub validates JWTs locally
# (no introspection): without this, a live access token outlives the account it was issued to.
# Cost: one IdP round trip per request. Off by default.
lumnik.auth.verify-with-idp=${LUMNIK_AUTH_VERIFY_WITH_IDP:false}
%prod.quarkus.oidc.authentication.user-info-required=${lumnik.auth.verify-with-idp}
%staging.quarkus.oidc.authentication.user-info-required=${lumnik.auth.verify-with-idp}

# SCIM endpoints carry an OPAQUE lumnik bearer (lmscim_...), NOT a Keycloak JWT. Route /scim/v2/*
# to a DISABLED OIDC tenant so Quarkus does not try to introspect the opaque token against the IdP
# (which 401s before our filter runs) — ScimAuthFilter authenticates these requests instead.
%prod.quarkus.oidc.scim.tenant-enabled=false
%prod.quarkus.oidc.scim.tenant-paths=/scim/v2/*
%staging.quarkus.oidc.scim.tenant-enabled=false
%staging.quarkus.oidc.scim.tenant-paths=/scim/v2/*
%otkauth.quarkus.oidc.scim.tenant-enabled=false
%otkauth.quarkus.oidc.scim.tenant-paths=/scim/v2/*

# External-IdP JIT: which token claim holds the stable subject (default OIDC `sub`).
# A customer with a canonical employee id sets OIDC_SUBJECT_CLAIM to that claim (e.g. employee_id).
lumnik.oidc.subject-claim=${OIDC_SUBJECT_CLAIM:sub}

# OTK real-auth battery profile: keyless OIDC (no Keycloak). The OTK harness
# generates an RSA keypair, exports the public key + issuer/audience, and boots the
# hub on this profile so every lane runs through real JWT validation.
# Datasource URLs are profile-specific (only %dev/%prod set them), so %otkauth must
# declare its own (mirroring %prod) or the datasource bean is inactive and boot fails.
%otkauth.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5433/lumnik}
%otkauth.quarkus.datasource."admin".jdbc.url=${DB_URL:jdbc:postgresql://localhost:5433/lumnik}
%otkauth.quarkus.datasource."readonly".jdbc.url=${DB_URL:jdbc:postgresql://localhost:5433/lumnik}
%otkauth.lumnik.security.dev-bypass=false
%otkauth.quarkus.oidc.public-key=${OTK_OIDC_PUBLIC_KEY}
%otkauth.quarkus.oidc.token.issuer=${OTK_OIDC_ISSUER}
%otkauth.quarkus.oidc.token.audience=${OTK_OIDC_AUDIENCE:lumnik-backend}
%otkauth.quarkus.oidc.application-type=service
%otkauth.quarkus.oidc.roles.source=accesstoken
%otkauth.quarkus.oidc.roles.role-claim-path=groups

# ── CORS (dev: allow Angular dev server) ───────────────────────────────────
%dev.quarkus.http.cors=true
%dev.quarkus.http.cors.origins=http://localhost:4200,http://localhost:4201
%dev.quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
%dev.quarkus.http.cors.headers=Content-Type,Authorization,X-Tenant-ID,X-User-ID

# ── Geocoder (Nominatim for org address → coords) ────────────────────────
lumnik.geocoder.provider=nominatim
lumnik.geocoder.nominatim.url=https://nominatim.openstreetmap.org/search
lumnik.geocoder.user-agent=lumnik/0.1 (admin@lumnik.local)

# ── Secret encryption (integrations, future credentials) ──────────────────
# 32-byte base64 key for pgp_sym_encrypt. Override in prod via env var.
lumnik.crypto.secret-key=${LUMNIK_CRYPTO_SECRET_KEY:dev-only-key-do-not-use-in-prod-please-rotate}

# ── Email & Outbox Events ──────────────────────────────────────────────────
# Email delivery (chantier C3). Mock is the fail-safe default: without a configured SMTP
# host, the 5-second EmailConsumer must not loop on delivery failures. Going live is two
# knobs, deliberately: LUMNIK_SMTP_HOST + LUMNIK_SMTP_MOCK=false — SmtpConfigSanity WARNs
# at boot when the host is set but mock is still on (the silent-failure the pair invites).
quarkus.mailer.host=${lumnik.smtp.host:localhost}
quarkus.mailer.port=${LUMNIK_SMTP_PORT:587}
quarkus.mailer.username=${LUMNIK_SMTP_USERNAME:}
quarkus.mailer.password=${LUMNIK_SMTP_PASSWORD:}
quarkus.mailer.from=${LUMNIK_SMTP_FROM:lumnik@localhost}
quarkus.mailer.start-tls=${LUMNIK_SMTP_STARTTLS:OPTIONAL}
quarkus.mailer.mock=${LUMNIK_SMTP_MOCK:true}

# É2.a events spine — see docs/studies/2026-06-12-e2-events-study.md
lumnik.events.retention-days=30

# Workflow dormancy sweep cadence (WorkflowDormancySweep @Scheduled placeholder default).
# lumnik.workflow.sweep.every=15m

# ── RAG ─────────────────────────────────────────────────────────────────────
# quarkus.langchain4j.* config lives in lumnik-llm-langchain/src/main/resources/application.properties
# (the only module that owns the langchain4j dependency). Quarkus merges all classpath
# application.properties at build time, so those keys are visible to the assembled application.

# In tests: skip startup indexing (EmbeddingPort / RetrievalService are replaced via @InjectMock)
%test.lumnik.rag.index-on-startup=false

# ── Kafka (kafka connector — raw KafkaConsumer, assign/seek, no group) ───────
# Kafka client is used by the kafka connector via a raw KafkaConsumer (assign/seek, no group).
# DevServices off — the connector's broker is declared per-connector; the Kafka IT runs Redpanda.
quarkus.kafka.devservices.enabled=false

# ── SecretResolver (pgcrypto AES-256 master key) ───────────────────────────
# Set via env LUMNIK_SECRET_MASTER_KEY at deploy time. Generate with: openssl rand -base64 32
lumnik.secret.master-key=${LUMNIK_SECRET_MASTER_KEY:CHANGE_ME_AT_DEPLOY_TIME_OR_STARTUP_WILL_FAIL}
%test.lumnik.secret.master-key=master-key-test-ok
# %dev only: stable local-only key. Never used in %prod (which requires env var).
%dev.lumnik.secret.master-key=dev-master-key-not-secure-only-for-local-32c

# ── %k8sdev: cloud-edition skeleton #1 (k8s/kind, dev-bypass ON, no Keycloak) ──
# Mirrors %otkauth: datasource URLs are profile-specific (only %dev/%prod set
# them by default), so this profile must declare its own for all three sources.
# Selected via QUARKUS_PROFILE=k8sdev. OIDC tenant disabled => boots with no IdP.
%k8sdev.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5433/lumnik}
%k8sdev.quarkus.datasource."admin".jdbc.url=${DB_URL:jdbc:postgresql://localhost:5433/lumnik}
%k8sdev.quarkus.datasource."readonly".jdbc.url=${DB_URL:jdbc:postgresql://localhost:5433/lumnik}
%k8sdev.lumnik.security.dev-bypass=true
%k8sdev.quarkus.oidc.tenant-enabled=false
# The encryption master key is injected at runtime via LUMNIK_SECRET_MASTER_KEY
# (the k8s Secret); it is intentionally not a profile property here.

# Hibernate 7 (Quarkus 3.33) refuses to silently reuse the REST ObjectMapper for JSON
# columns. Ours are JsonNode/Map/List plus annotation-driven records (no dates, no REST
# customization in play), so the DB-side default mapper serializes them identically.
quarkus.hibernate-orm.mapping.format.global=ignore
