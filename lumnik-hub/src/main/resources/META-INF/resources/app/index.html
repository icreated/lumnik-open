<!doctype html>
<!-- lumnik PWA — the real business app. Mounts <App/> over the tested logic layer
     (appRegistry/auth/api/views/format under src/). Per-app identity (title, manifest, icons)
     is resolved from ?m= against the runtime kind:App registry and swapped in before first
     paint — see appRegistry.mjs's header comment for the two-phase resolution this is phase 1
     of (#571). -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14121f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>lumnik</title>
<link rel="manifest" href="manifest-clients.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="root"></div>
<script type="module">
  import { resolveCached, applyIdentity, applyTheme } from './src/appRegistry.mjs';
  import { html, render } from './src/html.mjs';
  import { App } from './src/components/app.mjs';

  // wear the cached (or built-in/neutral fallback) identity AND theme: tab title,
  // manifest, icons (iOS reads apple-touch-icon), accent and mobile-chrome tint.
  // app.mjs corrects this once phase 2 resolves the real registry entry, so an
  // unrecognised tag or a first-ever visit to a runtime app never sees the WRONG
  // identity for more than one frame.
  const cached = resolveCached(location.search);
  applyIdentity(cached);
  applyTheme(cached);

  // app-shell cache only (E2) — data is never cached; a failed registration is not fatal
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/app/sw.js').catch(() => {});
  }

  render(html`<${App} />`, document.getElementById('root'));
</script>
</body>
</html>
