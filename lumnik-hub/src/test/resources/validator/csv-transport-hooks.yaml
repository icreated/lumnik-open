apiVersion: connectors.lumnik.io/v1
kind: Connector
metadata:
  name: nightly-export
  connector_type: csv-file
  scopes: [billing]
spec:
  transport:
    kind: local
    path: /imports/*.csv
    file_filter: hooks/only-invoices.kts
    pre_process: hooks/unzip.kts
    max_file_size: 10485760
  parser:
    has_header: true
  after_process: none
  target: {}
