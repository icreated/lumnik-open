apiVersion: connectors.lumnik.io/v1
kind: Connector
metadata:
  name: nightly-export
  connector_type: csv-file
  scopes: [billing]
spec:
  transport:
    kind: local
    path: /imports/*.csv
  parser:
    has_header: true
  after_process: none
  mapping:
    row:
      - split-row:
          explode: tags
      - map-columns:
          rename:
            cust_no: customer_id
      - validate-row:
          required: [name]
  target: {}
