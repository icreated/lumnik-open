apiVersion: connectors.lumnik.io/v1
kind: Connector
metadata:
  name: stripe-prod
  connector_type: rest-generic
  scopes: [crm, customers]
spec:
  base_url: https://api.stripe.com
  schedule: "*/15 * * * *"
  window: "22:00-06:00"
  headers:
    - name: X-Acme-Tenant
      value: acme
  auth:
    kind: bearer
    token_env: STRIPE_API_KEY
  endpoints:
    - id: customers
      path: /v1/customers
      method: GET
      pagination:
        kind: cursor
        cursor_param: starting_after
        cursor_path: $.data[-1:].id
        has_more_path: $.has_more
        response_path: $.data
      target:
        kind: hybrid
        table: stripe_customers
        unique_key: $.id
        promote:
          - name: name
            path: $.name
            type: text
