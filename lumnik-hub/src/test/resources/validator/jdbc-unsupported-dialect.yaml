apiVersion: connectors.lumnik.io/v1
kind: Connector
metadata:
  name: bad-jdbc
  connector_type: jdbc-generic
  scopes: [erp]
spec:
  connection:
    url: jdbc:oracle:thin:@//db.acme.io:1521/billing
    user: ro_user
    password_env: ACME_DB_PASSWORD
  source:
    tables:
      - name: invoices
        mode: full
        pk_columns: [id]
