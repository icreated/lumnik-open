apiVersion: connectors.lumnik.io/v1
kind: Connector
metadata:
  name: acme-erp-pg
  connector_type: jdbc-generic
  scopes: [erp]
spec:
  connection:
    url: jdbc:postgresql://db.acme.io:5432/billing
    user: ro_user
    password_env: ACME_DB_PASSWORD
  source:
    tables:
      - name: invoices
        schema: public
        mode: full
        pk_columns: [id]
        rename:
          id: source_id
