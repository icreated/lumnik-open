apiVersion: connectors.lumnik.io/v1
kind: Connector
metadata:
  name: header-null-name
  connector_type: rest-generic
spec:
  base_url: https://api.example.com
  headers:
    - name: null            # explicit null — runtime skips it (Map.get("name")==null); must be rejected
      value: my-tenant-id
  endpoints:
    - id: items
      path: /items
      method: GET
      pagination:
        kind: cursor
        cursor_param: starting_after
        cursor_path: "$.data[-1:].id"
        has_more_path: "$.has_more"
        response_path: "$.data"
      target:
        kind: hybrid
        table: x_items
        unique_key: "$.id"
        tags: [x]
