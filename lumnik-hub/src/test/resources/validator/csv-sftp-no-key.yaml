apiVersion: connectors.lumnik.io/v1
kind: Connector
metadata:
  name: acme-billing
  connector_type: csv-file
  tags: [crm]
spec:
  transport:
    kind: sftp
    host: sftp.acme.io
    user: lumnik
    path: /export/*.csv
  parser:
    has_header: true
  schedule: "0 6 * * *"
  after_process: archive
  target:
    tags: [crm, billing]
