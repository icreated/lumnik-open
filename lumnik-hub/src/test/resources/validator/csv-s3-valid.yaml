apiVersion: connectors.lumnik.io/v1
kind: Connector
metadata:
  name: s3-import
  connector_type: csv-file
  scopes: [analytics]
spec:
  transport:
    kind: s3
    bucket: acme-exports
    prefix: billing/
    region: eu-west-3
    suffix: .csv
  parser:
    has_header: true
  after_process: none
  target: {}
