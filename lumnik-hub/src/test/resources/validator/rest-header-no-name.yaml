apiVersion: connectors.lumnik.io/v1
kind: Connector
metadata:
  name: header-no-name
  connector_type: rest-generic
spec:
  base_url: https://api.example.com
  headers:
    - value: my-tenant-id
      # name intentionally omitted — must trigger a validation error
  endpoints:
    - id: items
      path: /items
      method: GET
      pagination:
        kind: cursor
        cursor_param: starting_after
        cursor_path: "$.data[-1:].id"
        has_more_path: "$.has_more"
        response_path: "$.data"
      target:
        kind: hybrid
        table: x_items
        unique_key: "$.id"
        tags: [x]
