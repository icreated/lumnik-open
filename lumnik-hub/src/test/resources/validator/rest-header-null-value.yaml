apiVersion: connectors.lumnik.io/v1
kind: Connector
metadata:
  name: header-null-value
  connector_type: rest-generic
  scopes: [x]
spec:
  base_url: https://api.example.com
  headers:
    - name: X-Tenant
      value: null          # explicit null — runtime skips it; must be rejected, not treated as present
  endpoints:
    - id: items
      path: /items
      method: GET
      pagination:
        kind: cursor
        cursor_param: starting_after
        cursor_path: "$.data[-1:].id"
        has_more_path: "$.has_more"
        response_path: "$.data"
      target:
        kind: hybrid
        table: x_items
        unique_key: "$.id"
