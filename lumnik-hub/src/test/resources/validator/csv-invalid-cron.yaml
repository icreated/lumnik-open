apiVersion: connectors.lumnik.io/v1
kind: Connector
metadata:
  name: acme-billing
  connector_type: csv-file
  scopes: [crm, billing]
spec:
  transport:
    kind: sftp
    host: sftp.acme.io
    user: lumnik
    path: /export/*.csv
    host_key_fingerprint: "SHA256:M0Is0aG8ubOr0cLpQs6QcDwVSxMkvmlfuW4K9Q6CJuc"
    key_env: ACME_SFTP_KEY
  parser:
    has_header: true
  schedule: "this is not cron"
  after_process: archive
  target: {}
