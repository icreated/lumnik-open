apiVersion: connectors.lumnik.io/v1
kind: Connector
metadata:
  name: acme-billing
  connector_type: csv-file
  tags: [crm]
spec:
  transport:
    kind: sftp
    host: sftp.acme.io
    user: lumnik
    path: /export/*.csv
    key_env: ACME_SFTP_KEY
  parser:
    has_header: true
  schedule: "this is not cron"
  after_process: archive
  target:
    tags: [crm, billing]
