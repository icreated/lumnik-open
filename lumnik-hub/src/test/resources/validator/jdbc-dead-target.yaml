# A JDBC manifest asking for an index inside `spec.target` — accepted and then dropped in
# silence before #543, because nothing on this kind reads that block. See JdbcConnectorValidator.
apiVersion: connectors.lumnik.io/v1
kind: Connector
metadata:
  name: acme-erp-pg
  connector_type: jdbc-generic
  scopes: [erp]
spec:
  connection:
    url: jdbc:postgresql://db.acme.io:5432/billing
    user: ro_user
    password_env: ACME_DB_PASSWORD
  source:
    tables:
      - name: invoices
        mode: full
        pk_columns: [id]
  target:
    indexes:
      - columns: [email]
