apiVersion: connectors.lumnik.io/v1
kind: Connector
metadata: { name: none-no-response-path, connector_type: rest-generic, scopes: [x] }
spec:
  base_url: https://clinic.example.com
  endpoints:
    - id: vets
      path: /vets.json
      method: GET
      pagination:
        kind: none
        # response_path intentionally omitted — must error
      target: { kind: hybrid, table: x_vets, unique_key: "$.id" }
