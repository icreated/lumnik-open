apiVersion: connectors.lumnik.io/v1
kind: Connector
metadata:
  name: nightly-export
  connector_type: csv-file
  scopes: [billing]
spec:
  transport:
    kind: local
    path: /imports/*.csv
  parser:
    has_header: true
  after_process: none
  mapping:
    row:
      - aggregator:
          emit-on-change: customer_id
          keep-first: [customer_id, name]
          merge:
            orders:
              collect: order_id
              into: array
  target: {}
