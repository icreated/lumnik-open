apiVersion: connectors.lumnik.io/v1
kind: Connector
metadata: { name: preset-spring, connector_type: rest-generic }
spec:
  base_url: https://api.example.com
  endpoints:
    - id: items
      path: /items
      method: GET
      pagination: { kind: spring-page }
      target: { kind: hybrid, table: x_items, unique_key: "$.id", tags: [x] }
