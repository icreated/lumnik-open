apiVersion: connectors.lumnik.io/v1
kind: Connector
metadata:
  name: endpoint-headers
  connector_type: rest-generic
  scopes: [x]
spec:
  base_url: https://api.example.com
  endpoints:
    - id: items
      path: /items
      method: GET
      headers:                       # per-endpoint headers are not supported in E1 — must be rejected
        - { name: X-Foo, value: bar }
      pagination:
        kind: cursor
        cursor_param: starting_after
        cursor_path: "$.data[-1:].id"
        has_more_path: "$.has_more"
        response_path: "$.data"
      target:
        kind: hybrid
        table: x_items
        unique_key: "$.id"
