apiVersion: connectors.lumnik.io/v1
kind: Connector
metadata:
  name: nightly-export
  connector_type: csv-file
  scopes: [billing]
spec:
  transport:
    kind: local
    path: /imports/*.csv
  parser:
    has_header: true
    empy_check: true
  after_process: none
  after_proces: delete
  windo: "22:00-06:00"
  target:
    tabel_prefix: t_
