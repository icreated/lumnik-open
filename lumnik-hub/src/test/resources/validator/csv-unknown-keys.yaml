apiVersion: connectors.lumnik.io/v1
kind: Connector
metadata:
  name: nightly-export
  connector_type: csv-file
  tags: [billing]
spec:
  transport:
    kind: local
    path: /imports/*.csv
  parser:
    has_header: true
    empy_check: true
  after_process: none
  target:
    tags: [billing]
    tabel_prefix: t_
