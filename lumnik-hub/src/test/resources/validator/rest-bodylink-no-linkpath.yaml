apiVersion: connectors.lumnik.io/v1
kind: Connector
metadata: { name: bodylink-no-linkpath, connector_type: rest-generic }
spec:
  base_url: https://api.example.com
  endpoints:
    - id: items
      path: /items
      method: GET
      pagination:
        kind: body-link
        response_path: "$.results"
        # link_path intentionally omitted — must error
      target: { kind: hybrid, table: x_items, unique_key: "$.id", tags: [x] }
