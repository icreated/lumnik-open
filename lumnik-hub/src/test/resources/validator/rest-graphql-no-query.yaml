apiVersion: connectors.lumnik.io/v1
kind: Connector
metadata:
  name: graphql-no-query
  connector_type: rest-generic
  scopes: [orders]
spec:
  base_url: https://api.example.com
  graphql_path: /graphql
  endpoints:
    - id: orders
      kind: graphql
      # query intentionally omitted — must trigger a validation error
      # path and method must NOT be required for graphql kind
      pagination:
        kind: relay
        cursor_binding: variable
        cursor_var: after          # bare variable name (no $; the $ prefix is query-document only)
        cursor_path: "$.data.orders.pageInfo.endCursor"
        has_more_path: "$.data.orders.pageInfo.hasNextPage"
        response_path: "$.data.orders.edges[*].node"
      target:
        kind: hybrid
        table: ext.orders
        unique_key: "$.id"
