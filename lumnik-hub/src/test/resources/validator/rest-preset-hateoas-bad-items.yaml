apiVersion: connectors.lumnik.io/v1
kind: Connector
metadata: { name: preset-hateoas-bad, connector_type: rest-generic, scopes: [x] }
spec:
  base_url: https://api.example.com
  endpoints:
    - id: items
      path: /items
      method: GET
      # items is interpolated into a JSONPath ($._embedded.{items}); metacharacters must be rejected
      pagination: { kind: spring-hateoas, items: "a.b['x']" }
      target: { kind: hybrid, table: x_items, unique_key: "$.id" }
