# Disambiguate embedding model provider for Quarkus build augmentation.
# BeansProcessor needs this at build time even when mocked at runtime.
quarkus.langchain4j.embedding-model.provider=ollama

# …and no LLM is downloaded to satisfy it. closed-extensions puts lumnik-llm-langchain on this
# module's classpath, so every @QuarkusTest here boots the Ollama dev service exactly as that
# module's own tests did: the 3 GB ollama/ollama image, then llama3.2 and gemma4. A developer
# never sees it — a local Ollama on 11434 makes the dev service stand down — and a CI runner
# has no such daemon. The same two knobs, for the same reason, as lumnik-llm-langchain's.
quarkus.langchain4j.ollama.devservices.enabled=false
quarkus.langchain4j.devservices.enabled=false

# DevServices must use a pgvector-capable image: rag's V1__rag_schema.sql runs
# CREATE EXTENSION vector during Flyway startup, which the vanilla postgres image
# lacks. Matches the docker-compose dev DB (pgvector/pgvector:0.8.6-pg16).
quarkus.datasource.devservices.image-name=pgvector/pgvector:0.8.6-pg16

# Kafka client is used by the kafka connector via a raw KafkaConsumer (assign/seek, no group).
# DevServices off — the connector's broker is declared per-connector; the Kafka IT runs Redpanda.
quarkus.kafka.devservices.enabled=false

# @QuarkusTest-only workaround: load the Ed25519 provider (Bouncy Castle) + sshd-common
# parent-first so the test augmentation classloader does not load the EdDSA key classes twice.
# A double-load makes sshd-common's instanceof/KeyFactory check reject the key spec
# ("key spec not recognised") during Ed25519 host-key verification. A packaged production app
# has a single runtime classloader and does not need this — SftpFileSource keeps full Ed25519
# support in production.
quarkus.class-loading.parent-first-artifacts=org.bouncycastle:bcprov-jdk18on,org.apache.sshd:sshd-common

# Rate limiting off in the shared test profile — RateLimitFilterIT re-enables one bucket.
lumnik.ratelimit.default.rpm=0
lumnik.ratelimit.view-generate.rpm=0

# The scheduler is live in most ITs, and many of them insert a Running run row and drive the chunk
# loop directly, without the run lock the engine takes before writing its rows. Keep the reaper's
# tick off rows younger than this so it never fails such a row mid-test. Production reaps at once.
lumnik.run-reaper.tick-grace=2m

# The workflow sweeps (dormancy, due date) are driven by their ITs through sweepNow/sweepAt. A live
# tick fires as soon as an application starts, and beside a test that deletes its ledger and
# re-declares its workflow with another zone it alerted that test's lines under the previous one
# (#1448). Not a production race: a re-declared zone is a new deadline, and a delete waits for the
# sweep's page (WorkflowDueSweep.STILL_DECLARED_SQL). A test's own seeding is not a declaration.
lumnik.workflow.sweep.every=off

# Export ITs tick a far-future instant (2099-01-01) at which every scheduled export the shared
# database still holds is due at once, and each expects ITS run from that one tick. Production's
# bound of 2 (#897) would start the leftovers over several ticks, which those tests do not wait for.
# ExportRunSchedulingIT pins the bound itself by holding the permits.
lumnik.export.max-concurrent-scheduled-runs=16
