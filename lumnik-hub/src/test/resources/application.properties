# Disambiguate embedding model provider for Quarkus build augmentation.
# BeansProcessor needs this at build time even when mocked at runtime.
quarkus.langchain4j.embedding-model.provider=ollama

# DevServices must use a pgvector-capable image: rag's V1__rag_schema.sql runs
# CREATE EXTENSION vector during Flyway startup, which the vanilla postgres image
# lacks. Matches the docker-compose dev DB (pgvector/pgvector:pg16).
quarkus.datasource.devservices.image-name=pgvector/pgvector:pg16

# Kafka client is used by the kafka connector via a raw KafkaConsumer (assign/seek, no group).
# DevServices off — the connector's broker is declared per-connector; the Kafka IT runs Redpanda.
quarkus.kafka.devservices.enabled=false

# @QuarkusTest-only workaround: load the Ed25519 provider (Bouncy Castle) + sshd-common
# parent-first so the test augmentation classloader does not load the EdDSA key classes twice.
# A double-load makes sshd-common's instanceof/KeyFactory check reject the key spec
# ("key spec not recognised") during Ed25519 host-key verification. A packaged production app
# has a single runtime classloader and does not need this — SftpFileSource keeps full Ed25519
# support in production.
quarkus.class-loading.parent-first-artifacts=org.bouncycastle:bcprov-jdk18on,org.apache.sshd:sshd-common

# Rate limiting off in the shared test profile — RateLimitFilterIT re-enables one bucket.
lumnik.ratelimit.default.rpm=0
lumnik.ratelimit.view-generate.rpm=0
